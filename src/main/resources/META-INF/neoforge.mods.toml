modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/watdafawx/hungry-loop/issues"

[[mixins]]
config = "hungryloop.mixins.json"

# Only applied when Accessories is installed - its plugin skips every mixin otherwise.
[[mixins]]
config = "hungryloop.accessories.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "hungryloop.png"
authors = "${mod_authors}"
description = '''
The Hungry Loop is a single curio that holds other curios. Whatever you slot into it - a ring, an
amulet, a Relics relic, an Artifacts artifact - behaves exactly as if it were equipped in its own
native slot: its attributes, its Apotheosis affixes and gem sockets, its Relics abilities. Built for
big modpacks where you never have enough curio slots to go around.

Storage starts at 4 slots and grows by feeding the loop experience; loot-found "shiny" loops start
with 4-8. The more slots it already has, the more each additional slot costs.

Curios is required. Apotheosis, Relics and Artifacts are optional - the loop works with any subset
installed.
'''

# --- Dependencies --------------------------------------------------------------------------------

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "curios"
type = "required"
versionRange = "[9.5.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "apotheosis"
type = "optional"
versionRange = "[8.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "relics"
type = "optional"
versionRange = "[0.12.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "artifacts"
type = "optional"
versionRange = "[13.0.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "accessories"
type = "optional"
# Any version: an unsupported Accessories just leaves the integration off (AccessoriesSupport).
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
