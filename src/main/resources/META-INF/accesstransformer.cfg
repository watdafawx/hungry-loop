# Access wideners for The Hungry Loop.
#
# ModDevGradle picks this file up automatically because it lives at
# src/main/resources/META-INF/accesstransformer.cfg.

# Slot#x / #y are public but final. CuriosPanelLayoutMixin re-positions the Curios panel's slots
# after setPage has built them, so the loop's hidden (mirror) slots don't leave holes in the grid.
# Only positions are touched - never the slot list itself, which has to stay index-identical
# between client and server.
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y

# Tab switches reopen the loop screen, which recentres the cursor; the screen puts it back.
public net.minecraft.client.MouseHandler xpos
public net.minecraft.client.MouseHandler ypos
