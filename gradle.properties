org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# NeoForge / Minecraft. neo_version must match minecraft_version to resolve a valid artifact.
# Latest for 1.21.1: https://projects.neoforged.net/neoforged/neoforge
neo_version=21.1.250
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
loader_version_range=[4,)

# Parchment (human-readable parameter names). https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# --- Dependency versions -------------------------------------------------------------------------
# Curios is the ONLY hard requirement. Everything else is compileOnly: it must be possible to
# compile, and run a dev client, with any subset of these installed. See build.gradle for where
# each one is resolved from, and AGENTS.md for why the dev run still needs jars in run/mods.
#
# For the Modrinth-mirror deps (relics, artifacts, octolib) the version is the Modrinth *version
# id*, not the version number - that is what api.modrinth.com/maven expects.
curios_version=9.5.1+1.21.1
apotheosis_version=8.7.0
placebo_version=9.9.2
apothic_attributes_version=2.10.1
relics_version=WKEe9sPL
artifacts_version=lMfuK0o7
octolib_version=yVCCi6TK
architectury_version=13.0.11

# --- Mod properties ----------------------------------------------------------------------------
mod_id=hungryloop
mod_name=The Hungry Loop
mod_version=0.6.0
mod_group_id=dev.mtop.hungryloop
mod_license=MIT
mod_authors=mtop

# This machine has AAAA records for the Maven hosts but no working IPv6 route, so the JVM stalls
# on connect until it falls back. Force IPv4 and be patient with slow mirrors.
systemProp.java.net.preferIPv4Stack=true
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000
